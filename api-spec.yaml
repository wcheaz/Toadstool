# ==============================================================================
# SECTION 16: IDEMPOTENCY SPECIFICATION
# ==============================================================================
idempotency:
  description: "Mechanism to prevent duplicate processing on retry"
  principle: "A client can safely retry any POST/PUT request using the same idempotency key; the server returns the original response without reprocessing"

  header:
    name: "Idempotency-Key"
    type: "string"
    format: "Alphanumeric + hyphens/underscores, 1-80 chars"
    example: "order-2026-09-22-abc123"
    required: "Strongly recommended for POST/PUT; optional for GET/DELETE"

  behavior:
    firstRequest:
      description: "Client sends request with Idempotency-Key header"
      action: "Server processes normally and caches the response"
      response: "Normal response (201 for creation, 200 for update)"
    secondRequest:
      description: "Client retries with the same Idempotency-Key within the retention period (24 hours)"
      action: "Server returns cached response without reprocessing"
      response: "HTTP 409 Conflict with cached response data"
      notes: "Client should recognize 409 as success, not failure; extract data from response"
    afterRetentionPeriod:
      description: "After 24 hours, idempotency key cache expires"
      action: "Resubmit is treated as a new request"
      response: "Normal response; may fail with different error if state changed"

  implementation:
    database:
      table: "idempotency_cache (message Kafka deduplication)"
      columns:
        - "key (VARCHAR 80, PRIMARY KEY)"
        - "requestHash (VARCHAR 64, SHA-256 of request body)"
        - "responseJson (TEXT, cached response)"
        - "statusCode (INTEGER)"
        - "createdAt (TIMESTAMPTZ)"
        - "expiresAt (TIMESTAMPTZ, +24 hours)"
    ttl: "24 hours"
    scoping: "Global (not per-client); collision risk minimal with strong client-generated keys"

# ==============================================================================
# SECTION 17: PAGINATION SPECIFICATION
# ==============================================================================
pagination:
  style: "Offset-based"
  rationale: "Simple to implement Week 1-2; cursor-based deferred to Week 4 as data volume grows"

  requestParams:
    limit:
      type: "integer"
      default: 50
      min: 1
      max: 1000
      description: "Number of records to return per page"

    offset:
      type: "integer"
      default: 0
      min: 0
      description: "Number of records to skip from the start"

  responseFields:
    limit: "integer (echoed from request)"
    offset: "integer (echoed from request)"
    totalCount: "integer (total records matching query, not including pagination)"
    hasMore: "boolean (true if more records exist beyond this page)"

  example:
    request: "GET /orders?limit=50&offset=0"
    response:
      orders: "[...]"
      pagination:
        limit: 50
        offset: 0
        totalCount: 247
        hasMore: true

# ==============================================================================
# SECTION 18: DATA VALIDATION RULES (Boundary Checks)
# ==============================================================================
validation:
  perField:
    email:
      rules:
        - "Must match RFC 5322 format (simplified: .+@.+)"
        - "Maximum 320 characters"
        - "UNIQUE per table (duplicate returns 409)"
      errorCode: "INVALID_EMAIL"
      httpStatus: 422

    displayName:
      rules:
        - "UTF-8 encoded"
        - "Length: 1-120 characters"
        - "Must not be blank/whitespace-only"
      errorCode: "INVALID_DISPLAY_NAME"
      httpStatus: 422

    symbol:
      rules:
        - "Alphanumeric + hyphens (pattern: ^[A-Z0-9-]+$)"
        - "Length: 1-40 characters"
        - "UNIQUE per instrument"
        - "Case: uppercase preferred (validation case-insensitive, stored as provided)"
      errorCode: "INVALID_SYMBOL"
      httpStatus: 422

    quantity:
      rules:
        - "Must be > 0 (strictly positive)"
        - "String format, parsed as numeric(28,10) / BigDecimal"
        - "Maximum 28 digits (inclusive of decimal places)"
        - "Decimal places: up to 10"
      errorCode: "QUANTITY_MUST_BE_POSITIVE"
      httpStatus: 422

    price:
      rules:
        - "Must be >= 0 (non-negative)"
        - "String format, parsed as numeric(28,10) / BigDecimal"
      errorCode: "INVALID_PRICE"
      httpStatus: 422

    password:
      rules:
        - "Minimum 8 characters"
        - "Should contain mix of upper, lower, numbers, special chars (recommended, not enforced)"
        - "Never logged or echoed in response"
        - "Hashed with Argon2 or Bcrypt (algorithm decision recorded)"
      errorCode: "PASSWORD_TOO_SHORT"
      httpStatus: 422

    status:
      rules:
        - "Must match allowed enum exactly (case-sensitive)"
      errorCode: "INVALID_STATUS"
      httpStatus: 422

    idempotencyKey:
      rules:
        - "Must be unique per (account_id, idempotency_key) tuple"
        - "Length: 1-80 characters"
        - "Alphanumeric + hyphens + underscores"
        - "Resubmit with same key = cached result (409), not error"
      errorCode: "DUPLICATE_IDEMPOTENCY_KEY"
      httpStatus: 409

  businessRules:
    buyOrder:
      rule: "Account must have sufficient cash balance"
      errorCode: "INSUFFICIENT_CASH"
      httpStatus: 422

    sellOrder:
      rule: "Account must hold sufficient quantity of the instrument"
      errorCode: "INSUFFICIENT_HOLDINGS"
      httpStatus: 422

    instrumentStatus:
      rule: "Instrument must be TRADABLE (not HALTED or INACTIVE)"
      errorCode: "INSTRUMENT_NOT_TRADABLE"
      httpStatus: 422

    clientDataAccess:
      rule: "Client can only access their own data; token.clientId must match resource.clientId"
      errorCode: "CROSS_CLIENT_ACCESS"
      httpStatus: 403

    adminAccess:
      rule: "Only ADMIN or ANALYST role can access /admin/* endpoints"
      errorCode: "INSUFFICIENT_ROLE"
      httpStatus: 403

