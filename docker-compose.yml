version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: toadstool-db
    environment:
      POSTGRES_USER: toadstool_user
      POSTGRES_PASSWORD: toadstool_password
      POSTGRES_DB: toadstool_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toadstool_user -d toadstool_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - toadstool-network

  # Uncomment below once you have a built JAR in target/
  # api:
  #   build: .
  #   container_name: toadstool-api
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/toadstool_db
  #     SPRING_DATASOURCE_USERNAME: toadstool_user
  #     SPRING_DATASOURCE_PASSWORD: toadstool_password
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - toadstool-network

volumes:
  postgres_data:
    driver: local

networks:
  toadstool-network:
    driver: bridge
