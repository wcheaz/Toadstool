<div class="modal-overlay" *ngIf="article" (click)="close.emit()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <button class="modal-close" (click)="close.emit()">✕</button>

    <div class="modal-body">
      <div class="modal-article">
        <h2 class="modal-title">{{ article.title }}</h2>
        <div class="modal-meta">
          <span class="modal-source">{{ article.market }}</span>
          <span class="modal-time">{{ article.timestamp }}</span>
        </div>

        <img *ngIf="article.imageUrl" [src]="article.imageUrl" class="modal-image" alt="Article image">

        <p class="modal-description">{{ article.description }}</p>

        <a *ngIf="article.sourceUrl" [href]="article.sourceUrl" target="_blank" class="modal-read-more">
          Read Full Article on Finnhub →
        </a>
      </div>
    </div>
  </div>
</div>
