<section class="balance-widget">
  <div class="balance-header">
    <div class="balance-title-section">
      <h2>Current Balance</h2>
    </div>
    <button class="visibility-toggle" (click)="toggleBalanceVisibility()" title="Toggle balance visibility">
      <svg *ngIf="isBalanceVisible" class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <svg *ngIf="!isBalanceVisible" class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
    </button>
  </div>

  <div class="balance-content">
    <div class="balance-left">
      <div class="balance-amount">
        <p class="balance-value-label">Current Balance</p>
        <p class="balance-value" *ngIf="isBalanceVisible">
          ${{ currentBalance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }}
        </p>
        <p class="balance-value hidden" *ngIf="!isBalanceVisible">••••••</p>
      </div>
      <div class="balance-available">
        <p class="available-label">Available for Trading</p>
        <p class="available-value" *ngIf="isBalanceVisible">${{ availableForTrading.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }}</p>
        <p class="available-value hidden" *ngIf="!isBalanceVisible">••••••</p>
      </div>
    </div>

    <div class="balance-actions">
      <button class="action-button depo-btn" (click)="deposit()" title="Deposit funds">
        Deposit
      </button>
      <button class="action-button withdraw-btn" (click)="withdraw()" title="Withdraw funds">
        Withdraw
      </button>
      <button class="action-button transfer-btn" (click)="transfer()" title="Transfer funds">
        Transfer
      </button>
    </div>
  </div>
</section>
