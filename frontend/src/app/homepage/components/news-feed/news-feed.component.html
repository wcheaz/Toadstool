<div class="dashboard-module news-module">
  <div class="module-header">
    <h3>News</h3>
    <ng-content select="[cardControls]"></ng-content>
  </div>
  <div class="news-section">
    @if (linkedSymbol; as symbol) {
      <div class="link-chip" role="status">
        <span><span aria-hidden="true">🔗</span> Showing {{ symbol }} news</span>
        <button type="button" (click)="setLinked(false)">Show all news</button>
      </div>
    } @else if (unlinkedSymbol; as symbol) {
      <div class="link-chip">
        <span>Showing all news</span>
        <button type="button" (click)="setLinked(true)">Show {{ symbol }} only</button>
      </div>
    }
    <app-news-notice
      [articles]="newsArticles"
      [loading]="loading"
      [error]="error"
      [emptyTitle]="linkedSymbol ? 'No recent ' + linkedSymbol + ' news' : 'No news available'"></app-news-notice>
    <app-news-card
      *ngFor="let article of newsArticles"
      [article]="article"
      [selectableAssets]="selectableSymbols"
      (assetSelected)="onSymbolSelected($event)"
      (open)="openNewsDetail($event)"></app-news-card>
  </div>
</div>

<app-news-detail-modal [article]="selectedNewsArticle" (close)="closeNewsDetail()"></app-news-detail-modal>
