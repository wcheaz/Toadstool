<div class="dashboard-module news-module">
  <div class="module-header">
    <h3>News</h3>
    <div class="module-handle">⋮⋮</div>
  </div>
  <div class="news-section">
    <p class="news-status" *ngIf="loading">Loading news...</p>
    <p class="news-status" *ngIf="error">{{ error }}</p>
    <p class="news-status" *ngIf="!loading && !error && newsArticles.length === 0">No news available yet.</p>
    <app-news-card *ngFor="let article of newsArticles" [article]="article" (open)="openNewsDetail($event)"></app-news-card>
  </div>
</div>

<app-news-detail-modal [article]="selectedNewsArticle" (close)="closeNewsDetail()"></app-news-detail-modal>
