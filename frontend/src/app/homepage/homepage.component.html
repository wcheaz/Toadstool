<div class="homepage-content">
  <section class="account-switcher" *ngIf="accounts.length > 0">
    <div>
      <span class="account-switcher-label">Active account</span>
      <select [value]="accountId" (change)="selectAccount(accounts[$any($event.target).selectedIndex])">
        <option *ngFor="let account of accounts" [value]="account.accountId">
          {{ account.accountName }} | {{ account.balance | currency:'USD':'symbol':'1.2-2' }}
        </option>
      </select>
    </div>
    <button class="create-account-button" type="button" (click)="createAccount()" [disabled]="isCreatingAccount">
      {{ isCreatingAccount ? 'Creating...' : 'Create account' }}
    </button>
  </section>

  <!-- Balance Widget -->
  <app-balance-widget
    [currentBalance]="currentBalance"
    [availableForTrading]="availableForTrading"
    (depositClicked)="openDepositModal()"
    (withdrawClicked)="onWithdrawClicked()"
    (transferClicked)="onTransferClicked()"></app-balance-widget>

  <!-- Content Tabs and Dashboard Area -->
  <section class="dashboard-content">
    <!-- NEWS TAB CONTENT -->
    <div class="tab-content">
      <div class="dashboard-grid">
        <!-- Left Column: News Module -->
        <app-news-feed></app-news-feed>

        <!-- Right Column: Market Assets + Features -->
        <div class="dashboard-column">
          <!-- Market Assets Module -->
          <app-market-assets-table
            [instruments]="instruments"
            [quotes]="instrumentQuotes"
            [loading]="loadingInstruments"
            [holdings]="holdings"
            (tradeRequested)="openTradeModal($event.instrument, $event.quote)">
          </app-market-assets-table>

          <!-- Features Module -->
          <app-features-grid></app-features-grid>
        </div>
      </div>
    </div>
  </section>

  <!-- Trading Modal -->
  <app-trading-modal
    [isOpen]="isTradeModalOpen"
    [selectedAsset]="selectedAsset"
    [accountId]="accountId"
    [accountBalance]="currentBalance"
    [candleData]="tradingChartData"
    [instrumentId]="selectedInstrumentId"
    (orderCompleted)="onOrderCompleted()"
    (close)="closeTradeModal()">
  </app-trading-modal>

  <!-- Error Modal -->
  <app-error-modal
    [isOpen]="isErrorModalOpen"
    [errorMessage]="errorMessage"
    [errorDetails]="errorDetails"
    (close)="closeErrorModal()">
  </app-error-modal>

  <!-- Deposit Modal -->
  <app-deposit-modal
    [isOpen]="isDepositModalOpen"
    (close)="closeDepositModal()"
    (submit)="onDepositSubmit($event)">
  </app-deposit-modal>
</div>
