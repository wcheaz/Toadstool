<div class="homepage-container">
  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- Top Bar -->
    <app-top-bar [clientName]="clientName"></app-top-bar>

    <!-- Balance Widget -->
    <app-balance-widget></app-balance-widget>

    <!-- Content Tabs and Dashboard Area -->
    <section class="dashboard-content">
      <div class="content-tabs">
        <button class="tab-button active" (click)="setActiveTab('news')">News</button>
        <button class="tab-button" (click)="setActiveTab('trading')">Trading</button>
        <button class="tab-button" (click)="setActiveTab('settings')">Settings</button>
      </div>

      <!-- NEWS TAB CONTENT -->
      <div class="tab-content" *ngIf="activeTab === 'news'">
        <div class="dashboard-grid">
          <!-- Left Column: News Module -->
          <app-news-feed></app-news-feed>

          <!-- Right Column: Market Assets + Features -->
          <div class="dashboard-column">
            <!-- Market Assets Module -->
            <app-market-assets-table
              [instruments]="instruments"
              [quotes]="instrumentQuotes"
              [loading]="loadingInstruments"
              (tradeRequested)="openTradeModal($event.instrument, $event.quote)">
            </app-market-assets-table>

            <!-- Features Module -->
            <app-features-grid></app-features-grid>
          </div>
        </div>
      </div>

      <!-- Trading Tab Content (placeholder) -->
      <div class="tab-content" *ngIf="activeTab === 'trading'">
        <div class="placeholder">
          <p>Trading features coming soon...</p>
        </div>
      </div>

      <!-- Settings Tab Content (placeholder) -->
      <div class="tab-content" *ngIf="activeTab === 'settings'">
        <div class="placeholder">
          <p>Settings features coming soon...</p>
        </div>
      </div>
    </section>

    <!-- Trading Modal -->
    <app-trading-modal
      [isOpen]="isTradeModalOpen"
      [selectedAsset]="selectedAsset"
      [candleData]="tradingChartData"
      [instrumentId]="selectedInstrumentId"
      (close)="closeTradeModal()">
    </app-trading-modal>
  </main>
</div>
