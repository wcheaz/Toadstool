<div class="app-wrapper">
  <app-sidebar *ngIf="isShowingMainLayout"></app-sidebar>
  <main class="main-layout" [class.full-width]="!isShowingMainLayout">
    <app-top-bar *ngIf="isShowingMainLayout" (profileClicked)="openProfileModal()"></app-top-bar>
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Profile Modal -->
  <app-profile-modal
    [isOpen]="isProfileModalOpen"
    (close)="closeProfileModal()">
  </app-profile-modal>
</div>
