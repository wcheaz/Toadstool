<div class="login-container">
  <div class="login-card">
    <div class="logo-section">
      <div class="logo-icon">T</div>
      <h1 class="brand-title">Toadstool Trader</h1>
    </div>

    <h2 class="welcome-title">Welcome back</h2>
    <p class="welcome-subtitle">Enter your credentials to access your portal</p>
    
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          class="form-control"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter your username"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="form-options">
        <div class="checkbox-group">
          <input
            type="checkbox"
            id="rememberMe"
            [(ngModel)]="rememberMe"
            name="rememberMe"
            [disabled]="isLoading"
          />
          <label for="rememberMe" class="checkbox-label">Remember Me</label>
        </div>
        <a href="#" class="forgot-password">Forgot Password?</a>
      </div>

      <button 
        type="submit" 
        class="btn btn-primary"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Logging in...' : 'Log In' }}
      </button>

      <div class="form-footer">
        <p><a routerLink="/register" class="admin-link">Create a client account</a></p>
        <p><a routerLink="/admin-login" class="admin-link">Admin Login</a></p>
      </div>
    </form>
  </div>
</div>
