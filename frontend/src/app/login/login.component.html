<div class="login-container">
  <div class="login-card">
    <h1 class="login-title">User Login</h1>
    
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          class="form-control"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter your username"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="form-actions">
        <button 
          type="submit" 
          class="btn btn-primary"
          [disabled]="isLoading"
        >
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>
        <button 
          type="button" 
          class="btn btn-secondary" 
          (click)="resetForm()"
          [disabled]="isLoading"
        >
          Clear
        </button>
      </div>

      <div class="form-footer">
        <p><a routerLink="/register" class="admin-link">Create a client account</a></p>
        <p><a routerLink="/admin-login" class="admin-link">Admin Login</a></p>
      </div>
    </form>
  </div>
</div>
