<div class="login-container">
  <div class="login-card">
    <div class="logo-section">
      <div class="logo-icon">T</div>
      <h1 class="brand-title">Toadstool Trader</h1>
    </div>

    <h2 class="welcome-title">Welcome back!</h2>
    <p class="welcome-subtitle">Enter your credentials to access your accounts</p>
    
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          class="form-control"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter your username"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            class="form-control"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            [disabled]="isLoading"
            required
          />
          <button type="button" class="password-toggle-btn" (click)="togglePasswordVisibility()" [disabled]="isLoading" title="Show/hide password">
            <svg class="password-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path *ngIf="!showPassword" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <path *ngIf="!showPassword" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path>
              <path *ngIf="showPassword" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line *ngIf="showPassword" x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-options">
        <div class="checkbox-group">
          <input
            type="checkbox"
            id="rememberMe"
            [(ngModel)]="rememberMe"
            name="rememberMe"
            [disabled]="isLoading"
          />
          <label for="rememberMe" class="checkbox-label">Remember Me</label>
        </div>
        <a href="#" class="forgot-password">Forgot Password?</a>
      </div>

      <button 
        type="submit" 
        class="btn btn-primary"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Logging in...' : 'Log In' }}
      </button>

      <div class="form-footer">
        <p>
          <a routerLink="/register" class="footer-link">Open an account</a>
          <span class="footer-dot">•</span>
          <a routerLink="/admin-login" class="footer-link">Administrator login</a>
        </p>
      </div>
    </form>
  </div>
</div>
