spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: trading-platform

  datasource:
    # Uses environment variables loaded from .env file
    # Prerequisites: .env file must be present with DB credentials
    # SSH tunnel (if needed): ssh -L 5435:localhost:5432 ec2-user@10.18.73.92
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:toadstool_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migrations
    table: flyway_schema_history
    validateOnMigrate: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.neueda.leap
  type-handlers-package: com.neueda.leap.mapper
  configuration:
    map-underscore-to-camel-case: true

fauxnance:
  baseUrl: ${FAUXNANCE_BASE_URL}
  apiKey: ${FAUXNANCE_API_KEY}
  timeoutSeconds: ${FAUXNANCE_TIMEOUT_SECONDS:10}

finnhub:
  apiKey: ${FINNHUB_API_KEY}
  baseUrl: https://finnhub.io/api/v1
  newsRateLimitDelayMs: 100

server:
  port: 8081

logging:
  level:
    root: INFO
    com.neueda.leap: DEBUG
    org.springframework.web: DEBUG

